<!DOCTYPE html>
<html lang="en" data-theme="warm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Ledger</title>
<meta name="description" content="A timetable calendar, contribution heatmap and time-consumption ledger for course work, research and reading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The default "Ledger" plan. js/fonts.js rewrites this link when another
     typographic plan is chosen, so only the faces in use are ever fetched. -->
<link id="fontPlan" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Spectral:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%238b1a1a'/><rect x='7' y='9' width='18' height='3' fill='%23f5f0eb'/><rect x='7' y='15' width='18' height='2' fill='%23f5f0eb' opacity='.7'/><rect x='7' y='20' width='11' height='2' fill='%23f5f0eb' opacity='.45'/></svg>">
</head>
<body>

<a class="skip" href="#main" data-t="ui.skip">Skip to content</a>

<div class="shell">

  <!-- ─────────────── spine / navigation ─────────────── -->
  <aside class="spine">
    <div class="spine__mark">
      <span class="spine__no">№</span>
      <h1 class="spine__title" data-t="app.name">Study Ledger</h1>
      <p class="spine__sub" data-t="app.tagline">time, kept</p>
    </div>

    <nav class="nav" data-t-label="ui.views" aria-label="Views">
      <a class="nav__item" href="#/calendar" data-view="calendar">
        <span class="nav__idx">i</span><span class="nav__label" data-t="nav.calendar">Calendar</span>
      </a>
      <a class="nav__item" href="#/heatmap" data-view="heatmap">
        <span class="nav__idx">ii</span><span class="nav__label" data-t="nav.heatmap">Heatmap</span>
      </a>
      <a class="nav__item" href="#/stats" data-view="stats">
        <span class="nav__idx">iii</span><span class="nav__label" data-t="nav.stats">Statistics</span>
      </a>
      <a class="nav__item" href="#/categories" data-view="categories">
        <span class="nav__idx">iv</span><span class="nav__label" data-t="nav.categories">Categories</span>
      </a>
      <a class="nav__item" href="#/palette" data-view="palette">
        <span class="nav__idx">v</span><span class="nav__label" data-t="nav.palette">Palette</span>
      </a>
    </nav>

    <div class="spine__meter" id="spineMeter" aria-live="polite"></div>

    <footer class="spine__foot">
      <button class="linkbtn" id="btnSettings" type="button" data-t="ui.settings">Settings</button>
      <span class="spine__dot">·</span>
      <button class="linkbtn" id="btnHelp" type="button" data-t="ui.help">Help</button>
    </footer>
  </aside>

  <!-- ─────────────── main ─────────────── -->
  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar__left">
        <h2 class="topbar__title" id="periodTitle">—</h2>
        <p class="topbar__sub" id="periodSub"></p>
      </div>

      <div class="topbar__right">
        <div class="stepper" id="periodNav">
          <button class="stepper__btn" data-step="-1" type="button" data-t-label="ui.prevPeriod">‹</button>
          <button class="stepper__now" data-step="0" type="button" data-t="ui.today">Today</button>
          <button class="stepper__btn" data-step="1" type="button" data-t-label="ui.nextPeriod">›</button>
        </div>
        <div class="segmented" id="scopeSwitch" role="tablist" data-t-label="ui.range"></div>
        <button class="btn btn--solid" id="btnNew" type="button">
          <span aria-hidden="true">+</span>&nbsp;<span data-t="ui.newEntry">New entry</span>
        </button>
      </div>
    </header>

    <div class="view" id="view"></div>
  </main>
</div>

<!-- ─────────────── entry editor ─────────────── -->
<dialog class="sheet" id="entrySheet">
  <form method="dialog" id="entryForm" class="sheet__form">
    <header class="sheet__head">
      <h3 class="sheet__title" id="entrySheetTitle">New entry</h3>
      <button class="iconbtn" type="button" data-cancel data-t-label="ui.close">✕</button>
    </header>

    <div class="sheet__body">
      <!-- The item comes first: choosing one already answers the category. -->
      <div class="field">
        <label for="fItem" data-t="ed.item">Item</label>
        <select id="fItem" required></select>
        <input type="text" id="fItemCustom" data-t-placeholder="ed.newItemPlaceholder"
               placeholder="Name the item" hidden autocomplete="off">
        <p class="field__hint" data-t="ed.itemHint">The course, project or book this time went into.</p>
      </div>

      <div class="field">
        <label for="fCategory" data-t="ed.category">Category</label>
        <div class="swatchrow">
          <span class="swatch" id="fSwatch" aria-hidden="true"></span>
          <select id="fCategory" required disabled></select>
          <button type="button" class="lockbtn is-locked" id="fLock" aria-pressed="true"
                  data-t-label="ed.unlock" aria-label="Unlock category">
            <svg viewBox="0 0 12 14" width="12" height="14" aria-hidden="true">
              <path class="lockbtn__shackle" d="M3.3 6.4V4.1a2.7 2.7 0 0 1 5.4 0v2.3"
                    fill="none" stroke="currentColor" stroke-width="1.5"/>
              <rect x="1.4" y="6.2" width="9.2" height="7" rx="1.5" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <p class="field__hint" id="fCatHint" data-t="ed.categoryLocked">Set by the item. Unlock to re-file it.</p>
      </div>

      <div class="field">
        <label for="fActivity" data-t="ed.activity">Activity</label>
        <select id="fActivity" required></select>
        <input type="text" id="fActivityCustom" data-t-placeholder="ed.newActivityPlaceholder"
               placeholder="Name the activity" hidden autocomplete="off">
        <p class="field__hint" data-t="ed.activityHint">Pick a common one, or add your own with Custom…</p>
      </div>

      <div class="grid3">
        <div class="field">
          <label for="fDate" data-t="ed.date">Date</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="field">
          <label for="fStart" data-t="ed.from">From</label>
          <input type="time" id="fStart" step="300" required>
        </div>
        <div class="field">
          <label for="fEnd" data-t="ed.to">To</label>
          <input type="time" id="fEnd" step="300" required>
        </div>
      </div>

      <p class="duration" id="fDuration"></p>

      <div class="field">
        <label for="fNote"><span data-t="ed.note">Note</span>
          <span class="opt" data-t="ui.optional">optional</span></label>
        <input type="text" id="fNote" maxlength="140" data-t-placeholder="ed.notePlaceholder"
               placeholder="Chapter 4 problem set, §2 proofs…" autocomplete="off">
      </div>
    </div>

    <footer class="sheet__foot">
      <button class="btn btn--ghost btn--danger" id="fDelete" type="button" hidden
              data-t="ui.delete">Delete</button>
      <span class="spacer"></span>
      <button class="btn btn--ghost" type="button" data-cancel data-t="ui.cancel">Cancel</button>
      <button class="btn btn--solid" id="fSave" value="save" type="submit" data-t="ui.save">Save</button>
    </footer>
  </form>
</dialog>

<!-- ─────────────── generic sheet (settings / help) ─────────────── -->
<dialog class="sheet" id="utilSheet">
  <div class="sheet__form">
    <header class="sheet__head">
      <h3 class="sheet__title" id="utilSheetTitle"></h3>
      <button class="iconbtn" type="button" data-close data-t-label="ui.close">✕</button>
    </header>
    <div class="sheet__body" id="utilSheetBody"></div>
    <footer class="sheet__foot" id="utilSheetFoot"></footer>
  </div>
</dialog>

<div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/palettes.js"></script>
<script src="js/palette-notes.js"></script>
<script src="js/i18n.js"></script>
<script src="js/fonts.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/theme.js"></script>
<script src="js/calendar.js"></script>
<script src="js/heatmap.js"></script>
<script src="js/stats.js"></script>
<script src="js/categories.js"></script>
<script src="js/app.js"></script>
</body>
</html>
